name: Build Cerclic (Windows et Mac)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    # CerclicOpen.exe and CerclicMenu.dll, compiled with mingw-w64 from Linux,
    # as scripts/build_windows.sh does
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Native helpers (CerclicOpen.exe, CerclicMenu.dll)
        run: |
          # sudo drops the environment: no question may wait for an answer
          APT="sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout 600 apt-get -q -o Acquire::Retries=3 -o Dpkg::Use-Pty=0"
          $APT update < /dev/null || { echo "::error::apt-get update ($?)"; exit 1; }
          $APT install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 < /dev/null \
            || { echo "::error::apt-get install ($?)"; exit 1; }
          mkdir -p dist_native
          cd native
          P=x86_64-w64-mingw32
          HARDEN="-Wl,--dynamicbase,--nxcompat,--high-entropy-va"
          $P-windres -O coff cerclic_open.rc -o cerclic_open.res
          $P-gcc -O2 -Wall -municode -mwindows -static -s $HARDEN -o ../dist_native/CerclicOpen.exe cerclic_open.c cerclic_open.res -lshell32
          $P-windres -O coff cerclic_menu.rc -o cerclic_menu.res
          $P-gcc -O2 -Wall -shared -s -static-libgcc $HARDEN -o ../dist_native/CerclicMenu.dll cerclic_menu.c cerclic_menu.def cerclic_menu.res -lole32 -lshell32 -lshlwapi -luuid -luser32
          ls -la ../dist_native

      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: dist_native/*
          retention-days: 7

  build:
    needs: native
    runs-on: windows-latest
    env:
      # Qt's offscreen platform finds no font on Windows without it (tests and
      # Store screenshots would get wider, box-like text)
      QT_QPA_FONTDIR: C:\Windows\Fonts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF -replace "refs/tags/v",""
          } else {
            $v = (Select-String -Path cerclic/__init__.py -Pattern '__version__ = "(.*)"').Matches.Groups[1].Value
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # PyInstaller's starter compiled here from its sources (antivirus
          # programs know the ready-made one, which malware authors use too)
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          pip install --force-reinstall --no-deps --no-binary pyinstaller pyinstaller==6.22.3

      - name: ffmpeg (from the imageio-ffmpeg wheel)
        shell: pwsh
        run: |
          pip download imageio-ffmpeg==0.6.0 --only-binary=:all: --platform win_amd64 --no-deps -d ffw
          Expand-Archive (Get-ChildItem ffw/*.whl | Select-Object -First 1).FullName -DestinationPath ffw/x -Force
          New-Item -ItemType Directory -Force -Path assets/ffmpeg | Out-Null
          Copy-Item (Get-ChildItem -Recurse ffw/x -Filter "ffmpeg-win*.exe" | Select-Object -First 1).FullName assets/ffmpeg/ffmpeg.exe -Force
          "$(Resolve-Path assets/ffmpeg)" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Run tests
        shell: pwsh
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/gen_installer_registry.py
          git diff --exit-code installer/registry.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::installer/registry.iss n'est plus a jour"; exit 1 }
          # failures also shown as annotations (readable without the full log)
          pytest -q -rfE --tb=line > pytest.txt 2>&1
          $code = $LASTEXITCODE
          Get-Content pytest.txt
          if ($code -ne 0) {
            Select-String -Path pytest.txt -Pattern '^(FAILED|ERROR) ' | Select-Object -First 5 |
              ForEach-Object { Write-Host "::error::$($_.Line.Replace('%','%25'))" }
            Select-String -Path pytest.txt -Pattern ':\d+: ' | Select-Object -First 3 |
              ForEach-Object { Write-Host "::error::$($_.Line.Replace('%','%25'))" }
            Write-Host "::error::$((Get-Content pytest.txt -Tail 1).Replace('%','%25'))"
            exit $code
          }

      - name: Native helpers (built by the native job)
        uses: actions/download-artifact@v4
        with:
          name: native
          path: dist_native

      - name: Build app (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller cerclic.spec --noconfirm --clean
          Copy-Item dist_native/CerclicOpen.exe dist/Cerclic/CerclicOpen.exe
          Copy-Item assets/LICENCES.txt dist/Cerclic/LICENCES.txt

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_installer | Out-Null
          Compress-Archive -Path dist/Cerclic -DestinationPath "dist_installer/Cerclic-${{ steps.ver.outputs.version }}-portable.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer/cerclic.iss

      - name: Microsoft Store package (MSIX)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/store/build.py
          Copy-Item dist_store/*.msix dist_installer/
          Copy-Item dist_store/*-test.zip dist_installer/

      - name: Check the Store package with Microsoft's makeappx
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName | Select-Object -Last 1
          if (-not $makeappx) { Write-Host "::warning::makeappx absent du runner : verification sautee"; exit 0 }
          foreach ($pkg in Get-ChildItem dist_store/*.msix) {
            & $makeappx.FullName unpack /p $pkg.FullName /d "unpacked\$($pkg.BaseName)" /o
            if ($LASTEXITCODE -ne 0) { throw "makeappx refuse $($pkg.Name)" }
            Write-Host "::notice::makeappx accepte $($pkg.Name)"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cerclic-${{ steps.ver.outputs.version }}
          path: dist_installer/*
          retention-days: 30

  build-mac:
    # Cerclic.app and its disk image, built by the same script as on a Mac
    # (Apple silicon). For Intel Macs, add a runner such as macos-15-intel.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build Cerclic.app and the disk image (with its self-test)
        run: bash scripts/build_mac.sh --no-install --no-open

      - name: Mac tests (Quick Action, login item, settings, on a real Mac)
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          .outils/bin/uv pip install --python .outils/venv/bin/python pytest==9.1.1 pytest-qt==4.5.0
          set +e
          .outils/venv/bin/python -m pytest -q -rfE --tb=line tests/test_mac.py > pytest.txt 2>&1
          code=$?
          cat pytest.txt
          if [ $code -ne 0 ]; then
            grep -E '^(FAILED|ERROR) ' pytest.txt | head -5 | sed 's/%/%25/g; s/^/::error::/'
            grep -E ':[0-9]+: ' pytest.txt | head -3 | sed 's/%/%25/g; s/^/::error::/'
            tail -1 pytest.txt | sed 's/%/%25/g; s/^/::error::/'
          fi
          exit $code

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cerclic-mac
          path: dist/*.dmg
          retention-days: 30

  release:
    # One release, once both systems are built, with a fixed name per system:
    # releases/latest/download/Cerclic-Windows.exe (or Cerclic-Mac.dmg) always
    # gives the newest version.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: Cerclic-*
          merge-multiple: true

      - name: Fixed names for the download links
        run: |
          cp out/CerclicSetup-*.exe out/Cerclic-Windows.exe
          cp out/Cerclic-*-mac-arm64.dmg out/Cerclic-Mac.dmg
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
