name: Build Cerclic (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF -replace "refs/tags/v",""
          } else {
            $v = (Select-String -Path cerclic/__init__.py -Pattern '__version__ = "(.*)"').Matches.Groups[1].Value
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - name: Download ffmpeg (static)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $exe = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path assets/ffmpeg | Out-Null
          Copy-Item $exe.FullName assets/ffmpeg/ffmpeg.exe -Force
          "$(Resolve-Path assets/ffmpeg)" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        shell: pwsh
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Build app (PyInstaller)
        shell: pwsh
        run: pyinstaller cerclic.spec --noconfirm

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Cerclic/* -DestinationPath "Cerclic-${{ steps.ver.outputs.version }}-portable.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer/cerclic.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cerclic-${{ steps.ver.outputs.version }}
          path: |
            dist_installer/*.exe
            Cerclic-*-portable.zip
          retention-days: 30

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_installer/*.exe
            Cerclic-*-portable.zip
          generate_release_notes: true
